<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة كافيتيريا الكلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 380px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .student-info {
            font-size: 0.9em;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ccc;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.05em;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #219150;
        }
        .results {
            margin-top: 20px;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .results p {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }
        .total {
            font-weight: bold;
            font-size: 1.1em;
            color: #c0392b;
            border-top: 2px solid #ddd;
            padding-top: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>فاتورة كافيتيريا الكلية</h2>
    <div class="student-info">
        <p><strong>الاسم:</strong> اسم الطالبة المصممة للبرنامج</p>
        <p><strong>الرقم الجامعي:</strong> الرقم الجامعي للطالبة</p>
    </div>

    <div class="input-group">
        <label for="item1">سعر الصنف الأول (ريال):</label>
        <input type="number" id="item1" value="10" step="any">
    </div>
    <div class="input-group">
        <label for="item2">سعر الصنف الثاني (ريال):</label>
        <input type="number" id="item2" value="15" step="any">
    </div>
    <div class="input-group">
        <label for="item3">سعر الصنف الثالث (ريال):</label>
        <input type="number" id="item3" value="5" step="any">
    </div>

    <button onclick="calculateInvoice()">حساب الفاتورة</button>

    <div class="results" id="output">
        <p><span>المجموع الأساسي (subtotal):</span> <strong id="subtotal">30.00 ريال</strong></p>
        <p><span>متوسط سعر الصنف (average):</span> <strong id="average">10.00 ريال</strong></p>
        <p><span>ضريبة القيمة المضافة (15%):</span> <strong id="tax">4.50 ريال</strong></p>
        <p><span>الخصم المستحق:</span> <strong>2.00 ريال</strong></p>
        <p class="total"><span>الإجمالي النهائي المستحق:</span> <strong id="total">32.50 ريال</strong></p>
    </div>
</div>

<script>
    function calculateInvoice() {
        const TAX_RATE = 0.15;
        const DISCOUNT = 2.0;

        let item1 = parseFloat(document.getElementById('item1').value) || 0;
        let item2 = parseFloat(document.getElementById('item2').value) || 0;
        let item3 = parseFloat(document.getElementById('item3').value) || 0;

        let subtotal = item1 + item2 + item3;
        let average = subtotal / 3;
        let tax = subtotal * TAX_RATE;
        let total = (subtotal + tax) - DISCOUNT;

        document.getElementById('subtotal').innerText = subtotal.toFixed(2) + ' ريال';
        document.getElementById('average').innerText = average.toFixed(2) + ' ريال';
        document.getElementById('tax').innerText = tax.toFixed(2) + ' ريال';
        document.getElementById('total').innerText = total.toFixed(2) + ' ريال';
    }
</script>

</body>
</html>
